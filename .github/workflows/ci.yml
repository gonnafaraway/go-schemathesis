name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          # Reads "go 1.26" from go.mod, so the toolchain never drifts from the module.
          go-version-file: go.mod
          # Dependencies are vendored, so the module cache is never populated.
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          # Always the newest release. Pin to e.g. "v2.14.0" if you would rather
          # reproduce lint results exactly and accept manual upgrades.
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: make build

      # -race matters here: the runner drives requests through a worker pool.
      # It requires cgo, which is enabled by default on ubuntu-latest.
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 7
          if-no-files-found: error
