name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Static binaries: this tool has no cgo dependencies.
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="schemathesis_${VERSION}_${GOOS}_${GOARCH}${ext}"

          go build -trimpath \
            -ldflags "-s -w -X github.com/gonnafaraway/go-schemathesis/internal/cli.Version=${VERSION}" \
            -o "dist/${name}" ./cmd/schemathesis

          # Verify the version really landed in the binary rather than only in
          # the Makefile. Only possible when the artifact runs on this runner.
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "$(go env GOARCH)" ]; then
            "dist/${name}" --version
            "dist/${name}" --version | grep -q "${VERSION}"
          fi

          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -q "${name}.zip" "$name"
          else
            tar -czf "${name}.tar.gz" "$name"
          fi
          rm "$name"

      - name: Upload archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Checksums and release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v7.0.1
        with:
          name: checksums
          path: dist/SHA256SUMS
          retention-days: 7

      # The gh CLI ships with the runner, so there is no third-party action to pin.
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" dist/SHA256SUMS dist/*.tar.gz dist/*.zip --clobber
          echo "Attached $(ls dist | wc -l) assets to $TAG"
